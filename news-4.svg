  </g>
  <g fill="#8c3b3b" opacity="0.8"><rect x="190" y="220" width="180" height="120" rx="4"/></g>
  <g fill="#2f4a6d" opacity="0.7"><circle cx="520" cy="360" r="60"/></g>
  <g filter="url(#shadow)">
    <circle cx="210" cy="620" r="36" fill="url(#pin)"/>
