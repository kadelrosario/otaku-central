<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121018"/><stop offset="1" stop-color="#2a1f2c"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0bd" stop-opacity="0.5"/><stop offset="1" stop-color="#ffe0bd" stop-opacity="0"/></linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3c3f48"/><stop offset="0.5" stop-color="#9aa0ad"/><stop offset="1" stop-color="#3c3f48"/></linearGradient>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g filter="url(#haze)">
    <polygon points="400,-40 230,700 570,700" fill="url(#beam)"/>
    <ellipse cx="400" cy="710" rx="240" ry="45" fill="#ffb27a" opacity="0.3"/>
  </g>
  <g filter="url(#soft)">
    <path d="M300 430 Q300 410 320 410 L480 410 Q500 410 500 430" stroke="#1a1a20" stroke-width="10" fill="none"/>
    <path d="M300 430 Q300 520 400 520 Q500 520 500 430" stroke="#1a1a20" stroke-width="10" fill="none"/>
    <rect x="382" y="520" width="36" height="120" fill="#1a1a20"/>
    <rect x="330" y="630" width="140" height="14" rx="7" fill="#1a1a20"/>
    <rect x="360" y="200" width="80" height="210" rx="40" fill="url(#mic)"/>
    <path d="M360 240 H440 M360 260 H440" stroke="#5a5f6b" stroke-width="2" opacity="0.6"/>
  </g>
  <rect width="800" height="800" filter="url(#grain)" fill="#000"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
